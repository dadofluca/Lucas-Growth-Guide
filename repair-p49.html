<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luca Update Repair</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3eadc;color:#26352e;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box}
main{max-width:430px;background:#fffaf2;border:1px solid #d9cbb8;border-radius:24px;padding:24px;box-shadow:0 12px 40px #5b463522;text-align:center}
h1{margin:0 0 10px;font-size:26px}.status{font-size:17px;line-height:1.45}small{display:block;margin-top:16px;opacity:.65}
</style>
<main><h1>Updating Luca…</h1><div class="status" id="s">Removing the old app cache.</div><small>Keep this page open for a few seconds.</small></main>
<script>
(async()=>{
 const s=document.getElementById('s');
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
   }
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.filter(k=>k.startsWith('luca-')).map(k=>caches.delete(k)));
   }
   s.textContent='Old Luca cache removed ✓ Loading P49…';
   setTimeout(()=>location.replace('./?recovered=p49-'+Date.now()),900);
 }catch(e){
   s.textContent='Repair hit a snag. Close this tab and try the link again.';
 }
})();
</script>
