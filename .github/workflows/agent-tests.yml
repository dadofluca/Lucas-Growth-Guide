name: Agent prototype tests
on:
  pull_request:
    paths:
      - 'agents/**'
      - 'index.html'
      - 'sw.js'
      - 'sync-fix.js'
      - 'family-pin.js'
      - 'supabase/migrations/**'
      - '.github/workflows/agent-tests.yml'
  push:
    branches:
      - feature/agent-operations-v1
    paths:
      - 'agents/**'
      - 'index.html'
      - 'sw.js'
      - 'sync-fix.js'
      - 'family-pin.js'
      - 'supabase/migrations/**'
      - '.github/workflows/agent-tests.yml'
permissions:
  contents: read
jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test agents/*.test.mjs
      - name: Verify synthetic Watchdog-to-Builder handoff
        run: node agents/synthetic-handoff.mjs
      - name: Upload synthetic QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-agent-qa
          path: artifacts/synthetic-agent-qa.json
          retention-days: 7
