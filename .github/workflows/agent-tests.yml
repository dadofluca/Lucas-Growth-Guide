name: Agent prototype tests
on:
  pull_request:
    paths:
      - 'agents/**'
      - '.github/workflows/agent-tests.yml'
  push:
    branches:
      - feature/agent-operations-v1
    paths:
      - 'agents/**'
      - '.github/workflows/agent-tests.yml'
permissions:
  contents: read
jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test agents/*.test.mjs
