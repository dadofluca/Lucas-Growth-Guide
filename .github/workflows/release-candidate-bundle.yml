name: Luca release candidate bundle
on:
  workflow_dispatch:
  push:
    branches: [feature/agent-operations-v1]
    paths:
      - 'index.html'
      - 'emergency.html'
      - 'sw.js'
      - 'family-pin.js'
      - 'sync-fix.js'
      - 'agents/**'
      - '.github/workflows/release-candidate-bundle.yml'
permissions:
  contents: read
jobs:
  preview-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression suite
        run: node --test agents/*.test.mjs
      - name: Produce release gate evidence report
        run: node agents/release-readiness.mjs
      - name: Check deployable entry points
        run: |
          test -s index.html
          test -s emergency.html
          test -s sw.js
          test -s family-pin.js
          test -s sync-fix.js
          test -s manifest.webmanifest
      - name: Package static candidate (no deployment)
        run: |
          mkdir -p release-candidate
          cp index.html emergency.html sw.js family-pin.js sync-fix.js manifest.webmanifest release-candidate/
          cp -r agents release-candidate/
          cp artifacts/release-readiness.json release-candidate/release-readiness.json
          # Keep root-level static assets referenced by the app, without copying repository metadata.
          find . -maxdepth 1 -type f \\( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.svg' -o -iname '*.ico' -o -iname '*.webp' -o -iname '*.mov' -o -iname '*.mp3' -o -iname '*.mp4' -o -iname '*.css' \\) -exec cp '{}' release-candidate/ \\;
          printf '%s\n' "${GITHUB_SHA}" > release-candidate/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: luca-static-release-candidate
          path: release-candidate/
          retention-days: 14
