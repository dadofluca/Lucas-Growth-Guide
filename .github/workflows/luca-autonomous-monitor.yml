name: Luca autonomous QA monitor
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: luca-autonomous-qa-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out development branch for isolated QA
        uses: actions/checkout@v4
        with:
          ref: feature/agent-operations-v1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated regression checks
        run: node --test agents/*.test.mjs
      - name: Synthetic agent handoff
        run: node agents/synthetic-handoff.mjs
      - name: Generate release readiness evidence
        run: node agents/release-readiness.mjs
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luca-autonomous-qa
          path: artifacts/
          retention-days: 14
      - name: Open or update a review issue if QA fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Luca autonomous QA failure"
          body="The scheduled development-branch QA run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. No app code was merged or deployed, and no family data was modified."
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
