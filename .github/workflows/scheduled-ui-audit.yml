name: Scheduled UI regression audit
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily-mobile-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full synthetic browser regression suite
        run: npx playwright test --config=playwright.config.mjs
      - name: Diagnose browser evidence and code
        if: always()
        run: node agents/doctor.mjs --run artifacts/browser-results.json
      - name: Upload Spark screenshots and next-assistant evidence (synthetic UI only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-mobile-screenshots
          path: |
            artifacts/spark/
            test-results/**/*.png
            artifacts/browser-results.json
            artifacts/unit-results.tap
            artifacts/doctor/
          retention-days: 7
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-ui-audit-failure
          path: artifacts/playwright-report/
          retention-days: 14
