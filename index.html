<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09131f"><title>Luca's Growth Guide</title><link rel="manifest" href="manifest.webmanifest">
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#f7fbff;background:#07101c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#224a70 0,#0c1929 38%,#07101c 70%)}button{font:inherit}.app{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 17px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#86b5d9;font-weight:800}h1{font-size:29px;margin:4px 0}.baby{width:50px;height:50px;border-radius:18px;background:linear-gradient(145deg,#6bc8ff,#80e0bf);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 28px #54bfff35}.glass,.card{border:1px solid #ffffff14;background:#ffffff0b;box-shadow:0 18px 50px #0004}.glass{margin-top:22px;border-radius:28px;padding:21px}.muted{color:#94a9bd}.next{font-size:45px;font-weight:850;letter-spacing:-.045em;margin:3px 0}.explain{font-size:13px;line-height:1.45;color:#afc0d1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.stat{background:#ffffff0a;border-radius:17px;padding:12px 5px;text-align:center}.stat b{font-size:21px;display:block}.stat small{font-size:11px;color:#8ea4b9}.card{border-radius:24px;padding:17px;margin-top:13px}h2{font-size:17px;margin:0 0 13px}.feeds,.events{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.feed,.event{border:0;border-radius:18px;padding:17px 4px;background:#14283d;color:#e8f4ff;font-weight:750}.feed.main{background:linear-gradient(145deg,#61c4ff,#71dec1);color:#062238;box-shadow:0 8px 25px #61c4ff2e}.event{font-size:21px;padding:12px 2px}.event small{display:block;font-size:10px;color:#a7b9ca;margin-top:5px}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid #ffffff0d}.row:first-child{border:0}.empty{font-size:13px;color:#8fa5ba}.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,15px);opacity:0;background:#e8f7ff;color:#0a2135;padding:10px 15px;border-radius:99px;font-weight:750;transition:.18s;z-index:4}.toast.on{opacity:1;transform:translate(-50%,0)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#091522e8;backdrop-filter:blur(20px);border-top:1px solid #ffffff12;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}nav button{border:0;background:none;color:#8098ae;font-size:11px;padding:7px}nav button b{display:block;font-size:18px;margin-bottom:2px;color:#72d4d0}</style></head>
<body><main class="app"><header class="top"><div><div class="kicker">Luca's Growth Guide</div><h1>Today</h1></div><div class="baby">🍼</div></header>
<section class="glass"><div class="muted">Estimated next feed</div><div class="next" id="next">—</div><div class="explain" id="why">Log Luca's feeds and his personal rhythm will start appearing here.</div><div class="stats"><div class="stat"><b id="oz">0</b><small>oz today</small></div><div class="stat"><b id="feeds">0</b><small>feeds</small></div><div class="stat"><b id="poops">0</b><small>poops</small></div></div></section>
<section class="card"><h2>Quick feed</h2><div class="feeds"><button class="feed" data-oz="5">5 oz</button><button class="feed" data-oz="6">6 oz</button><button class="feed" data-oz="7">7 oz</button><button class="feed main" data-oz="8">8 oz</button></div></section>
<section class="card"><h2>Quick log</h2><div class="events"><button class="event" data-e="poop">💩<small>Poop</small></button><button class="event" data-e="cranky">😣<small>Cranky</small></button><button class="event" data-e="happy">😊<small>Happy</small></button><button class="event" data-e="sleep">🌙<small>Sleep</small></button></div></section>
<section class="card"><h2>Today's timeline</h2><div id="timeline" class="empty">Nothing logged yet.</div></section></main><div class="toast" id="toast"></div><nav><button><b>⌂</b>Today</button><button><b>✦</b>Insights</button><button><b>◷</b>History</button></nav>
<script>const K="luca-log-v1";let a=JSON.parse(localStorage.getItem(K)||"[]");const day=d=>new Date(d).toDateString();function sound(t){try{let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=t==="poop"?90:650;g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.start();o.stop(c.currentTime+.2)}catch(e){}}function add(x){a.unshift({...x,at:new Date().toISOString()});localStorage.setItem(K,JSON.stringify(a));sound(x.type);let t=document.querySelector("#toast");t.textContent=x.type==="feed"?x.oz+" oz logged ✓":x.type+" logged ✓";t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1100);render()}function render(){let d=a.filter(x=>day(x.at)===day(Date.now())),f=d.filter(x=>x.type==="feed");oz.textContent=f.reduce((s,x)=>s+x.oz,0);feeds.textContent=f.length;poops.textContent=d.filter(x=>x.type==="poop").length;let all=a.filter(x=>x.type==="feed").slice(0,8);if(all.length){let m=180;if(all.length>1){let q=[];for(let i=0;i<all.length-1;i++)q.push((new Date(all[i].at)-new Date(all[i+1].at))/60000);m=q.reduce((s,x)=>s+x,0)/q.length}let n=new Date(new Date(all[0].at).getTime()+m*60000);next.textContent=n.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});why.textContent="Based on Luca's recent average of about "+Math.round(m/15)*15+" minutes between feeds."}timeline.innerHTML=d.length?d.map(x=>'<div class="row"><span>'+(x.type==="feed"?"🍼 "+x.oz+" oz":x.type==="poop"?"💩 Poop":x.type==="sleep"?"🌙 Sleep":x.type==="happy"?"😊 Happy":"😣 Cranky")+'</span><span class="muted">'+new Date(x.at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+'</span></div>').join(""):'Nothing logged yet.'}document.querySelectorAll("[data-oz]").forEach(b=>b.onclick=()=>add({type:"feed",oz:+b.dataset.oz}));document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>add({type:b.dataset.e}));render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");</script></body></html>
