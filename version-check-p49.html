<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luca Version Check</title><style>body{font-family:-apple-system,sans-serif;background:#f3eadc;color:#26352e;padding:30px}pre{white-space:pre-wrap;background:#fffaf2;padding:18px;border-radius:18px;font-size:16px}</style><h1>Luca version check</h1><pre id="o">Checking…</pre><script>(async()=>{let out=[];for(const f of ['index.html','family-pin.js?v=49','sync-fix.js?v=49']){try{let t=await fetch('./'+f+'?probe='+Date.now(),{cache:'no-store'}).then(r=>r.text());out.push(f+'\nP32 count: '+(t.match(/P32/g)||[]).length+'\nP49 count: '+(t.match(/P49/g)||[]).length+'\nbytes: '+t.length)}catch(e){out.push(f+' ERROR '+e)}}document.getElementById('o').textContent=out.join('\n\n')})();</script>
